<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>we-tube</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.468.0" integrity="sha384-uTYyvsSSUZeaPhb5RbKlQa0zY/WpX/QHfvg2mczXyBQOpkWPEDy9lczyp+w7SKXu" crossorigin="anonymous"></script>
<link rel="stylesheet" href="/css/styles.css"/>
<script src="/js/theme.js"></script>
</head>
<body>
  <div id="wt-nav"></div>

  <div class="px-4 md:px-6 py-4">
    <div class="flex items-center gap-2 mb-5 overflow-x-auto pb-1">
      <button data-type="video" class="wt-filter btn-ghost !border-0" style="background:var(--accent-soft);color:var(--accent)"><i data-lucide="clapperboard" class="ui-icon"></i> Videos</button>
      <button data-type="audio" class="wt-filter btn-ghost !border-0"><i data-lucide="music-2" class="ui-icon"></i> Audio</button>
      <button data-type="image" class="wt-filter btn-ghost !border-0"><i data-lucide="image" class="ui-icon"></i> Imagenes</button>
    </div>

    <div id="empty-state" class="hidden text-center py-24">
      <p class="text-lg font-medium mb-1">Tu catalogo esta vacio</p>
      <p class="text-sm mb-4" style="color:var(--text-muted)">Descarga contenido con yt-dlp o sube tus propios archivos para empezar.</p>
      <div class="flex justify-center gap-3">
        <a href="/download.html" class="btn-primary">Descargar de una URL</a>
        <a href="/upload.html" class="btn-ghost">Subir archivo</a>
      </div>
    </div>

    <div id="catalog-sections"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let currentType = 'video';
    let user = null;
    const NO_CHANNEL = 'Global (sin canal)';

    function card(item) {
      const thumb = item.thumbnail_path
        ? `<img src="/media-files/${item.thumbnail_path}" loading="lazy"/>`
        : item.media_type === 'image'
          ? `<img src="/media-files/${item.relative_path}" loading="lazy"/>`
          : `<div class="w-full h-full flex items-center justify-center text-3xl"><i data-lucide="${item.media_type === 'audio' ? 'music-2' : 'clapperboard'}" class="media-placeholder-icon"></i></div>`;

      const meta = [item.channel_name, WT.fmtViews(item.view_count), WT.fmtDate(item.published_at || item.created_at)]
        .filter(Boolean).join(' · ');

      return `
      <a href="/watch.html?id=${item.id}" class="video-card block">
        <div class="thumb-wrap">
          ${thumb}
          ${item.duration_seconds ? `<span class="duration-badge">${WT.fmtDuration(item.duration_seconds)}</span>` : ''}
          ${item.pending_download ? '<span class="download-pending-badge"><i data-lucide="clock-3" class="badge-icon"></i> Pendiente</span>' : ''}
          ${(() => { const status = WT.getWatchStatus(item.id, user); return `<span class="watch-status watch-status-${status.key}">${status.label}</span>`; })()}
        </div>
        <div class="mt-2">
          <p class="text-sm font-medium line-clamp-2">${item.title || item.file_name}</p>
          <p class="text-xs mt-1" style="color:var(--text-muted)">${meta || 'Sin metadata'}</p>
          <span class="type-badge mt-1 inline-flex items-center gap-1">${item.media_type}${item.favorite ? ' · <i data-lucide="star" class="badge-icon"></i>' : ''}</span>
          ${(() => { const status = WT.getWatchStatus(item.id, user); return status.key === 'progress' ? `<div class="watch-progress mt-2"><span style="width:${Math.min(100, status.percent || 0)}%"></span></div>` : ''; })()}
        </div>
      </a>`;
    }

    function renderSections(items) {
      const groups = new Map();
      items.forEach((item) => {
        const channel = item.channel_name && item.channel_name.trim() ? item.channel_name.trim() : NO_CHANNEL;
        if (!groups.has(channel)) groups.set(channel, []);
        groups.get(channel).push(item);
      });

      return [...groups.entries()].map(([channel, channelItems]) => {
        const channelId = channelItems.find((item) => item.channel_id)?.channel_id;
        const label = channel.replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
        return `
        <section class="channel-section">
          <div class="channel-section-header">
            <div class="flex items-center gap-2 min-w-0">
              <i data-lucide="${channel === NO_CHANNEL ? 'library' : 'radio'}" class="section-icon"></i>
              <h2 class="text-lg font-semibold truncate">${label}</h2>
            </div>
            <span class="text-xs shrink-0" style="color:var(--text-muted)">${channelItems.length} ${channelItems.length === 1 ? 'elemento' : 'elementos'}</span>
          </div>
          <div class="channel-grid">${channelItems.map(card).join('')}</div>
          ${channelId ? `<div class="channel-section-footer"><button data-channel-id="${channelId}" class="wt-load-more-channel btn-ghost"><i data-lucide="list-plus" class="ui-icon"></i> Cargar más</button></div>` : ''}
        </section>`;
      }).join('');
    }

    function bindLoadMoreChannels(q) {
      document.querySelectorAll('.wt-load-more-channel').forEach((button) => {
        button.onclick = async () => {
          button.disabled = true;
          button.innerHTML = '<i data-lucide="loader-circle" class="ui-icon spin-icon"></i> Cargando...';
          WT.refreshIcons();
          try {
            const result = await WTApi.loadMoreChannel(button.dataset.channelId);
            WT.toast(`${result.pending || 0} videos pendientes añadidos.`);
            load(q);
          } catch (err) {
            button.disabled = false;
            button.innerHTML = '<i data-lucide="list-plus" class="ui-icon"></i> Cargar más';
            WT.refreshIcons();
            WT.toast(err.message, true);
          }
        };
      });
    }

    async function load(q) {
      const sections = document.getElementById('catalog-sections');
      const empty = document.getElementById('empty-state');
      sections.innerHTML = '<p style="color:var(--text-muted)">Cargando...</p>';
      try {
        const items = await WTApi.listMedia(q, currentType);
        sections.innerHTML = renderSections(items);
        WT.refreshIcons();
        bindLoadMoreChannels(q);
        empty.classList.toggle('hidden', items.length > 0);
        sections.classList.toggle('hidden', items.length === 0);
      } catch (err) {
        sections.innerHTML = '';
        WT.toast(err.message, true);
      }
    }

    document.querySelectorAll('.wt-filter').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentType = btn.dataset.type;
        document.querySelectorAll('.wt-filter').forEach((b) => {
          b.style.background = ''; b.style.color = '';
        });
        btn.style.background = 'var(--accent-soft)'; btn.style.color = 'var(--accent)';
        load(new URLSearchParams(location.search).get('q'));
      });
    });

    (async () => {
      user = await WT.guard();
      if (!user) return;
      WT.renderNav('home', user);
      const q = new URLSearchParams(location.search).get('q');
      if (q) document.getElementById('wt-search').value = q;
      load(q);
    })();
  </script>
</body>
</html>
