<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>we-tube · Reproduciendo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/styles.css"/>
<script src="/js/theme.js"></script>
</head>
<body>
  <div id="wt-nav"></div>
  <div class="watch-layout">
    <main>
      <div id="player-wrap" class="rounded-xl overflow-hidden" style="background:#000"></div>

      <div class="mt-4 flex items-start justify-between gap-4">
        <div>
          <h1 id="title" class="text-xl font-semibold"></h1>
          <p id="meta" class="text-sm mt-1" style="color:var(--text-muted)"></p>
        </div>
        <div class="flex gap-2 shrink-0">
          <button id="fav-btn" class="btn-ghost">⭐ Favorito</button>
          <button id="delete-btn" class="btn-ghost" style="color:var(--danger)">🗑️ Eliminar</button>
        </div>
      </div>

      <label class="autoplay-control mt-4">
        <input id="autoplay-toggle" type="checkbox" class="w-auto"/>
        <span>Reproducir automáticamente el siguiente video</span>
      </label>

      <div id="source-info" class="card rounded-xl p-4 mt-4 text-sm hidden">
        <p style="color:var(--text-muted)">Fuente original</p>
        <a id="source-link" href="#" target="_blank" class="break-all" style="color:var(--accent)"></a>
      </div>
    </main>
    <aside id="up-next" class="watch-queue hidden" aria-label="Siguientes videos">
      <div class="flex items-center justify-between gap-3 mb-3">
        <h2 class="text-lg font-semibold">Siguientes</h2>
        <span id="queue-count" class="text-xs" style="color:var(--text-muted)"></span>
      </div>
      <div id="queue-list" class="space-y-3"></div>
    </aside>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const user = await WT.guard();
      if (!user) return;
      WT.renderNav('', user);

      const id = new URLSearchParams(location.search).get('id');
      if (!id) { window.location.href = '/index.html'; return; }

      try {
        const item = await WTApi.getMedia(id);
        const autoplayToggle = document.getElementById('autoplay-toggle');
        autoplayToggle.closest('label').classList.toggle('hidden', item.media_type !== 'video');
        autoplayToggle.checked = WT.getAutoplay(user);
        document.getElementById('title').textContent = item.title || item.file_name;
        const meta = [item.channel_name, WT.fmtViews(item.view_count),
          item.like_count ? `${item.like_count} likes` : null,
          WT.fmtDate(item.published_at || item.created_at), WT.fmtBytes(item.file_size_bytes)]
          .filter(Boolean).join(' · ');
        document.getElementById('meta').textContent = meta;
        document.getElementById('fav-btn').textContent = item.favorite ? '⭐ Quitar favorito' : '⭐ Favorito';

        let nextItems = [];
        function renderQueue(items) {
          nextItems = items.filter((candidate) => candidate.id !== item.id && candidate.media_type === 'video').slice(0, 8);
          document.getElementById('queue-count').textContent = nextItems.length ? `${nextItems.length} disponibles` : 'Sin más videos';
          document.getElementById('queue-list').innerHTML = nextItems.map((candidate) => `
            <a href="/watch.html?id=${candidate.id}" class="queue-item">
              <div class="queue-thumb">
                ${candidate.thumbnail_path ? `<img src="/media-files/${candidate.thumbnail_path}" loading="lazy"/>` : '<span>🎬</span>'}
                ${candidate.duration_seconds ? `<span class="duration-badge">${WT.fmtDuration(candidate.duration_seconds)}</span>` : ''}
              </div>
              <div class="min-w-0">
                <p class="text-sm font-medium line-clamp-2">${candidate.title || candidate.file_name}</p>
                <p class="text-xs mt-1" style="color:var(--text-muted)">${WT.getWatchStatus(candidate.id, user).label}</p>
              </div>
            </a>`).join('') || '<p class="text-sm" style="color:var(--text-muted)">No hay más videos.</p>';
          document.getElementById('up-next').classList.remove('hidden');
        }
        async function loadQueue() {
          try {
            const items = await WTApi.listMedia();
            const currentIndex = items.findIndex((candidate) => candidate.id === item.id);
            const ordered = currentIndex >= 0 ? items.slice(currentIndex + 1).concat(items.slice(0, currentIndex)) : items;
            renderQueue(ordered);
          } catch (err) {
            WT.toast('No se pudo cargar la cola de reproducción', true);
          }
        }
        autoplayToggle.onchange = () => {
          WT.setAutoplay(user, autoplayToggle.checked);
          loadQueue();
        };
        await loadQueue();

        const wrap = document.getElementById('player-wrap');
        const src = `/api/media/${item.id}/stream`;
        if (item.media_type === 'video') {
          wrap.innerHTML = `<video src="${src}" controls autoplay class="w-full" style="height:100%;max-height:100%;object-fit:contain"></video>`;
          const player = wrap.querySelector('video');
          WT.trackPlayback(item.id, user, player);
          player.addEventListener('ended', () => {
            if (autoplayToggle.checked && nextItems[0]) window.location.href = `/watch.html?id=${nextItems[0].id}`;
          });
        } else if (item.media_type === 'audio') {
          wrap.innerHTML = `<div class="p-10 flex flex-col items-center gap-4 text-white">
            <div class="text-6xl">🎵</div>
            <audio src="${src}" controls autoplay class="w-full max-w-md"></audio></div>`;
          WT.trackPlayback(item.id, user, wrap.querySelector('audio'));
        } else {
          wrap.innerHTML = `<img src="${src}" class="w-full" style="height:100%;max-height:100%;object-fit:contain"/>`;
          WT.markViewed(item.id, user);
        }

        if (item.source_url) {
          document.getElementById('source-info').classList.remove('hidden');
          document.getElementById('source-link').href = item.source_url;
          document.getElementById('source-link').textContent = item.source_url;
        }

        document.getElementById('fav-btn').onclick = async () => {
          const r = await WTApi.toggleFavorite(item.id);
          document.getElementById('fav-btn').textContent = r.favorite ? '⭐ Quitar favorito' : '⭐ Favorito';
        };
        document.getElementById('delete-btn').onclick = async () => {
          if (!confirm('¿Eliminar este archivo permanentemente?')) return;
          await WTApi.deleteMedia(item.id);
          WT.toast('Archivo eliminado');
          window.location.href = '/index.html';
        };
      } catch (err) {
        WT.toast(err.message, true);
      }
    })();
  </script>
</body>
</html>
